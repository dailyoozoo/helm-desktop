[package]
name = "helm"
version = "0.6.4"
description = "Helm —— 驱动本地 CLI Agent 的桌面控制台"
edition = "2021"
rust-version = "1.77"

# Tauri 2 推荐的库 + 二进制结构：lib 承载全部逻辑，main.rs 仅调用 run()。
[lib]
name = "helm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
# 强制打开 indexmap 的 std feature（仅构建依赖上下文）。
# schemars 0.8.22（经 tauri-build -> tauri 引入）把可选依赖 indexmap 声明为
# features = ["serde-1"]，假定 std 是默认 feature；indexmap 1.9+ 把 std 移出默认值，
# 于是 schemars 的 IndexMap<K, V> 别名缺少 S 参数而编译失败（E0107）。
# 构建依赖与常规依赖各自做 feature 统一，必须写在这里。
indexmap = { version = "1.9", features = ["std", "serde-1"] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-dialog = "2"
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"
tauri-plugin-log = "2"
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
regex = "1"
sha2 = "0.10"
minisign-verify = "0.2.5"
base64 = "0.22"
rand = "0.9"
keyring = { version = "3", features = ["windows-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
rusqlite = { version = "0.32", features = ["bundled"] }
tokio = { version = "1", features = [
  "macros",
  "rt-multi-thread",
  "process",
    "io-util",
    "fs",
  "net",
  "sync",
  "time",
] }
tokio-tungstenite = "0.28"
futures-util = "0.3"
dirs = "6.0.0"
opener = "0.7"
zip = { version = "2", default-features = false, features = ["deflate"] }
pdf-extract = "0.7"
tauri-plugin-window-state = "2"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = [
  "Win32_Foundation",
  "Win32_Globalization",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_Security_Isolation",
  "Win32_Storage_FileSystem",
    "Win32_System_Pipes",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }
