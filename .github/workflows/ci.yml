name: CI

on:
  push:
  pull_request:

permissions:
  contents: read
  checks: write

jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: npm ci
      - run: npm run check
      - run: npm run check:version
      - run: cargo test --manifest-path src-tauri/Cargo.toml -- --test-threads=1
        timeout-minutes: 30
      - run: npm run build
      - run: npm run release:audit
      - run: npm audit --omit=dev

  rustsec:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          working-directory: src-tauri
          # lopdf RUSTSEC-2026-0187（经 pdf-extract 间接引入，patched 需 pdf-extract 0.12，
          # 仅影响本地解析用户自选 PDF 附件的 DoS）——audit-check@v2 不读取 .cargo/audit.toml，
          # 忽略项必须在此传入；与 src-tauri/.cargo/audit.toml 保持同步。
          ignore: RUSTSEC-2026-0187
