name: Pricing catalog audit

on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run pricing:validate
      - name: Compare machine-readable discovery source
        run: npm run pricing:check-upstream
      - name: Explain next action
        if: failure()
        run: |
          echo "Upstream discovery changed. Verify every candidate against the vendor's official pricing page,"
          echo "update sourceUrl/observedAt/sequence, then sign and publish to the domestic mirrors."
